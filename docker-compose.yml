services:
  app:
    build: .
    container_name: kate_app
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: kate_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kate_tampos
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3311:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: kate_phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8083:80"
    depends_on:
      - db

volumes:
  db_data: